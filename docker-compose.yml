
services:

  # Banco de dados MongoDB local
  mongodb:
    image: mongo:7.0
    container_name: timbro-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - timbro-net

  # Backend 1 - Java Spring Boot
  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timbro-backend1
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/timbro?authSource=admin
      BLOCKCHAIN_WS_URL: ${BLOCKCHAIN_WS_URL}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET}
      APP_SECURITY_JWT_EXPIRATION: 86400000
    depends_on:
      - mongodb
      - backend2
    networks:
      - timbro-net

  # Backend 2 - Python FastAPI
  backend2:
    build:
      context: ../pi4-0102-g5-backend-2
      dockerfile: Dockerfile
    container_name: timbro-backend2
    restart: always
    ports:
      - "8000:8000"
    networks:
      - timbro-net

  # Frontend - React
  frontend:
    build:
      context: ../pi4-0102-g5-frontend
      dockerfile: Dockerfile
    container_name: timbro-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
      REACT_APP_WS_URL: ws://localhost:8080
    depends_on:
      - backend1
    networks:
      - timbro-net

# Volume para persistir os dados do MongoDB
volumes:
  mongo_data:

# Rede compartilhada entre os contêineres
networks:
  timbro-net:
    driver: bridge
